  <rect x="81" y="221" width="52" height="91" rx="26" fill="#A78BFA" stroke="#FAF5FF" stroke-width="7" />
  <rect x="379" y="221" width="52" height="91" rx="26" fill="#A78BFA" stroke="#FAF5FF" stroke-width="7" />
  <rect x="111" y="127" width="290" height="265" rx="78" fill="url(#head)" stroke="#FAF5FF" stroke-width="9" />
  <rect x="143" y="159" width="226" height="199" rx="54" fill="#1B1035" stroke="#7C3AED" stroke-width="7"/>
  <path d="M204 317V202L308 317V202" fill="none" stroke="url(#letter)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" />
